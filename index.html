<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>JinSan Tower Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>JinSan Tower Game</h1>
    <div class="headerRight">
      <span id="version">v17.6</span>
      <span id="score">Score: 0</span>
    </div>
  </header>

  <main>
    <div class="stage">
      <canvas id="gameCanvas"></canvas>
      <div id="status" class="status">読み込み中…</div>
    </div>
    <div class="controls">
      <button id="rotateLeft" type="button" aria-label="左回転">↶</button>
      <button id="drop" type="button">落とす</button>
      <button id="rotateRight" type="button" aria-label="右回転">↷</button>
    </div>
  </main>

  <!-- Matter.js is loaded before the game modules. v17.6 intentionally uses
       the CDN so the project does not depend on a missing local lib file. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/piece.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/input.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
