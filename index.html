<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>JinSan Tower Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>JinSan Tower Game</h1>
    <div id="score">Score: 0</div>
  </header>

  <main>
    <div class="stage">
      <canvas id="gameCanvas"></canvas>
    </div>

    <div class="controls">
      <button id="rotateLeft" type="button">↶</button>
      <button id="drop" type="button">落とす</button>
      <button id="rotateRight" type="button">↷</button>
    </div>

    <div id="debug" class="debug" hidden></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/piece.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/input.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
