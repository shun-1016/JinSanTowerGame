<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ベビータワーバトル</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <h1>ベビータワーバトル</h1>
      <p id="status">読み込み中…</p>
    </div>
    <div class="score"><span>スコア <b id="score">0</b></span></div>
  </header>

  <main class="game-wrap">
    <div class="stage">
      <canvas id="game"></canvas>
      <div id="debug" class="debug" aria-live="polite"></div>
      <div id="gameover" class="overlay hidden">
        <div class="panel">
          <h2>ゲーム終了</h2>
          <p id="result"></p>
          <p id="resultDetail"></p>
          <button id="restart" type="button">もう一度</button>
        </div>
      </div>
    </div>

    <div class="rotate-controls" aria-label="回転操作">
      <button id="rotateLeft" type="button" aria-label="左に回転">↺</button>
      <span>回転</span>
      <button id="rotateRight" type="button" aria-label="右に回転">↻</button>
    </div>
  </main>

  <footer>
    <span>ピースを左右に動かして、タップを離すと落下。↺↻で回転。</span>
    <button id="reset" type="button">リセット</button>
  </footer>
</div>
<script src="game.js"></script>
</body>
</html>
