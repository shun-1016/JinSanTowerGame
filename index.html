<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon.png">
  <title>仁さんタワー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>JinSan Tower Game</h1>
    <div class="headerRight"><span id="version">v21.8</span><button id="endButton" class="endButton" type="button">終了</button></div>
  </header>
  <main>
    <div class="stage">
      <canvas id="gameCanvas"></canvas>
      <div class="hud">
        <div class="scorePanel">
          <div><span class="hudLabel">SCORE</span><strong id="hudScore">0</strong></div>
          <div><span class="hudLabel">BEST</span><strong id="hudBest">—</strong></div>
          <div><span class="hudLabel">HEIGHT</span><strong id="hudHeight">0.0</strong><small>m</small></div>
        </div>
        <div id="nextPanel" class="nextPanel">
          <span class="nextLabel">NEXT</span>
          <div class="nextPreview"><img id="nextPieceImage" alt="次のピース"></div>
        </div>
      </div>
      <div id="status" class="status">読み込み中…</div>
      <div id="shapeDebug" class="shapeDebug hidden">輪郭解析: 待機中</div>
      <div id="modeModal" class="modeModal">
        <div class="modeCard">
          <h2>ゲームモード</h2>
          <p>遊び方を選択してください</p>
          <button id="normalModeButton" class="modeButton normalModeButton" type="button">
            <strong>通常モード</strong>
            <span>土台の外へ落ちるとゲームオーバー</span>
          </button>
          <button id="endlessModeButton" class="modeButton endlessModeButton" type="button">
            <strong>エンドレスモード</strong>
            <span>左右の壁で落下を防ぎ、どこまでも積み上げる</span>
          </button>
        </div>
      </div>
      <div id="resultScreen" class="resultScreen hidden">
        <div class="resultCard">
          <h2>ゲームオーバー</h2>
          <div id="newRecord" class="newRecord hidden">NEW RECORD!</div>
          <p class="resultLabel">今回のスコア</p>
          <div id="resultScore" class="resultScore">0</div>
          <div class="resultStats"><span>高さ <strong id="resultHeight">0.0</strong>m</span><span>積み上げ <strong id="resultPieces">0</strong>個</span></div>
          <p class="bestTitle">歴代ベスト3</p>
          <ol id="bestScores" class="bestScores"></ol>
          <button id="restartButton" class="restartButton" type="button">もう一度遊ぶ</button>
        </div>
      </div>
    </div>
    <div class="controls">
      <button id="rotateLeft" type="button" aria-label="左回転"><span class="buttonText">左回転</span></button>
      <button id="drop" type="button"><span class="buttonIcon dropIcon">▼</span><span class="buttonText">落とす</span></button>
      <button id="rotateRight" type="button" aria-label="右回転"><span class="buttonText">右回転</span></button>
    </div>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/piece.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/input.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
