name: Extract measurement log ZIP

on:
  push:
    branches:
      - develop
    paths:
      - 'log/**/*.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find newly uploaded ZIP
        id: find_zip
        run: |
          ZIP_FILE=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- 'log/**/*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "Found: $ZIP_FILE"

      - name: Extract ZIP
        run: |
          ZIP_FILE="${{ steps.find_zip.outputs.ZIP_FILE }}"

          VERSION_DIR=$(dirname "$ZIP_FILE")
          ZIP_NAME=$(basename "$ZIP_FILE" .zip)

          echo "ZIP: $ZIP_FILE"
          echo "Destination: $VERSION_DIR/$ZIP_NAME"

          mkdir -p "$VERSION_DIR/$ZIP_NAME"
          unzip -o "$ZIP_FILE" -d "$VERSION_DIR/$ZIP_NAME"

      - name: Commit extracted CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add log/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract measurement log ZIP"
          git push
