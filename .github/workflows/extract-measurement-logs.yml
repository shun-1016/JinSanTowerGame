name: Extract measurement log ZIP

on:
  push:
    branches:
      - develop
    paths:
      - 'log/**/*.zip'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find measurement log ZIP
        id: find_zip
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            ZIP_FILE=$(git diff-tree --no-commit-id --name-only -r HEAD^ HEAD --diff-filter=A -- ':(glob)log/**/*.zip' | head -n 1)
          else
            ZIP_FILE=$(find log -type f -name '*.zip' | sort | tail -n 1)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "No measurement log ZIP found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "Found: $ZIP_FILE"

      - name: Extract ZIP
        run: |
          ZIP_FILE="${{ steps.find_zip.outputs.ZIP_FILE }}"
          VERSION_DIR=$(dirname "$ZIP_FILE")

          echo "ZIP: $ZIP_FILE"
          echo "Destination: $VERSION_DIR"

          unzip -o "$ZIP_FILE" -d "$VERSION_DIR"

      - name: Commit extracted CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add log/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract measurement log ZIP"
          git push
